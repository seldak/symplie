[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symplie"
version = "0.2.0"
description = "Moser-Veselov rigid-body attitude dynamics and geometric control in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jax>=0.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "matplotlib>=3.8",
  "scipy>=1.11"
]
docs = [
  "mkdocs-material>=9.7,<10",
  "mkdocstrings[python]>=0.30"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
