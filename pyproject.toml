[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symplie"
version = "0.1.0"
description = "JAX Lie-group operations and structure-preserving rigid-body integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jax>=0.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "matplotlib>=3.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
