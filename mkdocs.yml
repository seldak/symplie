site_name: SympLie
site_description: Differentiable Lie-group rigid-body dynamics and attitude control in JAX
site_url: https://seldak.github.io/symplie/
repo_url: https://github.com/seldak/symplie
repo_name: seldak/symplie

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Conventions: conventions.md
  - Compatibility: compatibility.md
  - Numerical validation: validation.md
  - API reference:
      - Geometry: api/geometry.md
      - Dynamics: api/dynamics.md
      - Control: api/control.md
      - Kinematics: api/kinematics.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            members_order: source
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; 2026 SympLie contributors
