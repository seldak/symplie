name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and generate plots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Generate conservation plots
        run: python scripts/make_plots.py --out artifacts

      - name: Upload conservation plots
        uses: actions/upload-artifact@v7
        with:
          name: conservation-plots
          path: |
            artifacts/energy_drift.png
            artifacts/spatial_momentum_error.png
          if-no-files-found: error
          retention-days: 14
